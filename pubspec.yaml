name: dawim
description: "Dawim — daily Quran reading habit app. Constant, even if small."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/quran/
    - assets/fonts/qcf4/

  fonts:
    - family: ThmanyahSerifDisplay
      fonts:
        - asset: assets/fonts/ThmanyahSerifDisplay-Light.otf
          weight: 300
        - asset: assets/fonts/ThmanyahSerifDisplay-Regular.otf
          weight: 400
        - asset: assets/fonts/ThmanyahSerifDisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/ThmanyahSerifDisplay-Bold.otf
          weight: 700
        - asset: assets/fonts/ThmanyahSerifDisplay-Black.otf
          weight: 900
    - family: ThmanyahSans
      fonts:
        - asset: assets/fonts/ThmanyahSans-Light.otf
          weight: 300
        - asset: assets/fonts/ThmanyahSans-Regular.otf
          weight: 400
        - asset: assets/fonts/ThmanyahSans-Medium.otf
          weight: 500
        - asset: assets/fonts/ThmanyahSans-Bold.otf
          weight: 700
        - asset: assets/fonts/ThmanyahSans-Black.otf
          weight: 900
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs_V22.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/dawim01.png
  # Without adaptive layers, Android launchers letterbox the legacy icon in
  # a white circle. Foreground is the icon at 85% on a transparent canvas
  # (the mask crops the outer ~33%, so the green fills the whole shape);
  # background matches the icon's edge green for any mask peek-through.
  adaptive_icon_background: "#2A5C47"
  adaptive_icon_foreground: assets/icon/dawim01_adaptive_fg.png
